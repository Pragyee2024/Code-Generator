<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"  href="./Images/icon.jpg">
    <title>QR Code Generator</title>
</head>
<body>
    <div id ="mainContainer">
        <div class="sidebar">
            <img src="./Images/icon.jpg" alt="qr png">
            <div class="textContainer">
                <h1>Generate QR codes for your URLs, text, or other data.</h1>
                <p>Enter your text or URL above and click "Generate QR Code" to create a scannable QR code.</p>
            </div>
        </div>
        <div class="homeContainer">
            <div class="home">
                <h2>Enter text or URL</h2>
                <input type="text" id="qrInput" placeholder="Enter text or URL">
                <button id="generateBtn">Generate QR Code</button>
            </div>
        </div>
    </div>


    <div id="qrPopup">
        <h2>QR Code</h2>
        <img src="" alt="qr image">
        <button id="downloadBtn">Download QR</button>
        <button id="closeBtn">Close</button>
    </div>


    <script src="app.js"></script>
</body>
</html>
